name: Build va Release (Windows .exe)

# "v1.2.0" kabi tag push qilinganda avtomatik ishga tushadi:
#   git tag v1.2.0 && git push origin v1.2.0
# Windows runner'da PyInstaller bilan .exe yasaydi, uni O'QING.txt va
# bo'sh persist_dictionary.json bilan birga zip qiladi, so'ng shu tag
# nomi bilan GitHub Release yaratib, ikkalasini (.exe va .zip) unga
# biriktiradi.
#
# .exe ga launcher.py yig'iladi — core.py emas. Launcher core.py ni har
# ishga tushganda GitHub'dan oladi, shuning uchun kundalik tuzatishlar
# uchun bu workflow'ni ishga tushirish SHART EMAS: git push kifoya.
# Yangi release faqat launcher.py o'zgarganda kerak bo'ladi.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Launcher faqat standart kutubxonani import qiladi, core.py esa
      # exec() ichida bajariladi — PyInstaller uning import'larini
      # ko'rmaydi. Shuning uchun core.py ning har bir bog'liqligi shu
      # yerda qo'lda ko'rsatilgan, aks holda .exe da ModuleNotFoundError
      # chiqadi. core.py ga yangi kutubxona qo'shilsa, shu ro'yxatga ham
      # qo'shib, .exe ni qayta yig'ish kerak.
      - name: .exe yasash (PyInstaller)
        run: >
          pyinstaller --onefile --windowed
          --name SoddaHisobot --icon app_icon.ico
          --add-data "core.py;."
          --collect-all openpyxl
          --collect-all sv_ttk
          --hidden-import tkinter
          --hidden-import tkinter.ttk
          --hidden-import tkinter.font
          --hidden-import tkinter.filedialog
          --hidden-import tkinter.messagebox
          launcher.py

      - name: Paketlash (exe + O'QING.txt + bo'sh dictionary)
        shell: pwsh
        run: |
          Copy-Item "O'QING.txt" "dist/O'QING.txt"
          Set-Content -Path "dist/persist_dictionary.json" -Value "{}" -Encoding utf8
          Compress-Archive -Path "dist/SoddaHisobot.exe","dist/O'QING.txt","dist/persist_dictionary.json" -DestinationPath "dist/SoddaHisobot.zip"

      - name: Release yaratish va fayllarni biriktirish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SoddaHisobot.exe
            dist/SoddaHisobot.zip
          generate_release_notes: true
